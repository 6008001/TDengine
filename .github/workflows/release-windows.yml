name: Release Windows packages

# Build TDengine community Windows x64 packages (server + client) with the
# win-branch MSVC fixes and publish them:
#   * manually via workflow_dispatch (artifacts only)
#   * automatically on tags matching win-v* / v* (artifacts + GitHub Release)
#
# Package contents: taosd, taos, taosBenchmark, taosdump, taosudf, taosmqtt,
# taosadapter (Go+CGO, built from the taosdata/taosadapter main branch) and the
# Python UDF plugin (BUILD_PYUDF=ON, downloads a CPython SDK at build time).
# taoskeeper is not built or packaged.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (numeric, e.g. 3.4.3.9). Leave empty to auto-detect from the build.'
        required: false
        default: ''
  push:
    tags:
      - 'win-v*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build & package Windows x64
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout TDengine (win branch)
        uses: actions/checkout@v4

      - name: Checkout taosadapter (main branch)
        uses: actions/checkout@v4
        with:
          repository: taosdata/taosadapter
          ref: 'main'
          path: taosadapter-src

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          # taosadapter main requires go >= 1.26.0. Pin a concrete version
          # instead of 'stable' so a Go release cannot break the build silently.
          go-version: '1.26'
          check-latest: true

      - name: Install Inno Setup and MinGW (CGO for taosadapter)
        id: mingw
        shell: pwsh
        run: |
          choco install innosetup mingw -y --no-progress
          # choco's mingw package deploys to C:\ProgramData\mingw64\mingw64;
          # fall back to a recursive search inside the chocolatey lib tree.
          $gcc = @('C:\ProgramData\mingw64\mingw64\bin\gcc.exe',
                   "$env:ChocolateyInstall\lib\mingw\tools\install\mingw64\bin\gcc.exe") |
                   Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $gcc) {
            $gcc = (Get-ChildItem "$env:ChocolateyInstall\lib\mingw" -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue |
                    Select-Object -First 1).FullName
          }
          if (-not $gcc) { throw 'mingw gcc.exe not found' }
          "mingw=$(Split-Path $gcc)" >> $env:GITHUB_OUTPUT

      - name: Locate Windows SDK um\x64 lib dir
        id: sdk
        shell: pwsh
        run: |
          $lib = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Lib' -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $sdkdir = Join-Path $lib.FullName 'um\x64'
          if (-not (Test-Path (Join-Path $sdkdir 'rpcrt4.lib'))) {
            throw "Windows SDK um\x64 libs not found at $sdkdir"
          }
          "sdkdir=$sdkdir" >> $env:GITHUB_OUTPUT

      - name: Detect Visual Studio generator
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $ver = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion)
          if (-not $ver) { throw 'no Visual Studio C++ toolchain found on runner' }
          switch -Wildcard ($ver) {
            '17*' { $gen = 'Visual Studio 17 2022' }
            '18*' { $gen = 'Visual Studio 18 2026' }
            '16*' { $gen = 'Visual Studio 16 2019' }
            default { throw "unsupported VS installation version: $ver" }
          }
          Write-Host "VS $ver -> generator '$gen'"
          "generator=$gen" >> $env:GITHUB_OUTPUT

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "${{ steps.vs.outputs.generator }}" -A x64 `
            -DBUILD_TOOLS=ON `
            -DBUILD_PYUDF=ON `
            -DBUILD_VER_OSTYPE=windows64 `
            -DSYSTEM_SYSTEM_PATH="${{ steps.sdk.outputs.sdkdir }}" `
            -DCMAKE_LIBRARY_PATH="${{ steps.sdk.outputs.sdkdir }}"

      - name: Build TDengine
        shell: pwsh
        run: |
          # Runner CMake is 4.x which dropped compatibility with
          # cmake_minimum_required < 3.5; several vendored externals
          # (win-iconv, pthread-win32, ...) still declare 2.x/3.0. The env
          # var is inherited by every ExternalProject sub-configure.
          $env:CMAKE_POLICY_VERSION_MINIMUM = '3.5'
          cmake --build build --config Release --parallel

      - name: Detect package version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) {
            # Resolve runtime DLLs (pthreadVC3.dll) next to the executable; a
            # missing DLL makes the process die with 0xC0000135 and an empty
            # stdout, which used to be swallowed by 2>$null.
            $bin = Join-Path $PWD 'build\build\bin\Release'
            $env:Path = "$bin;$env:Path"
            $exe = Join-Path $bin 'taos.exe'
            $raw = (& $exe -V 2>&1 | Out-String)
            Write-Host $raw
            if ($LASTEXITCODE -ne 0) {
              Write-Host "taos.exe -V exited with $LASTEXITCODE; falling back to CMake cache"
            }
            if ($raw -match 'version:\s*([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)') {
              $v = $Matches[1]
            } else {
              $cache = Get-Content 'build\CMakeCache.txt' -ErrorAction SilentlyContinue |
                Where-Object { $_ -match '^BUILD_VER_NUMBER:STRING=(.+)$' } |
                Select-Object -First 1
              if ($cache -and $cache -match '([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)') {
                $v = $Matches[1]
                Write-Host "version taken from CMakeCache: $v"
              }
            }
          }
          if (-not $v) { throw 'Unable to determine package version' }
          "version=$v" >> $env:GITHUB_OUTPUT

      # make_install.bat (run by `cmake --install`) picks the component configs
      # up from <build>/test/cfg, so they must be staged before the install step.
      - name: Stage component configs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\test\cfg | Out-Null
          Copy-Item taosadapter-src\example\config\taosadapter.toml build\test\cfg\taosadapter.toml -Force

      - name: Flatten outputs for make_install.bat (single-config layout)
        shell: pwsh
        run: |
          Copy-Item build\build\bin\Release\* build\build\bin\ -Force
          Copy-Item build\build\lib\Release\* build\build\lib\ -Force

      - name: Install to C:\TDengine
        shell: pwsh
        run: cmake --install build --config Release

      # taosadapter's cgo directives hardcode C:/TDengine/include (the installed
      # tree), so it can only be built after the install step. Since main it no
      # longer links taosnative: driver/native dlopen()s the client driver at run
      # time, so only <taos.h> is needed at build time.
      - name: Build taosadapter (Go + CGO)
        shell: pwsh
        run: |
          $mingw = '${{ steps.mingw.outputs.mingw }}'
          $v = '${{ steps.ver.outputs.version }}'
          # Stamp the taosadapter commit, not github.sha: the latter is the
          # TDengine commit that triggered this run and means nothing to the
          # adapter. Read it from the checkout so it tracks the pinned ref.
          $commit = (& git -C taosadapter-src rev-parse HEAD).Trim()
          $buildTime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' +0000'
          $env:CGO_ENABLED = '1'
          $env:CC = "$mingw\gcc.exe"
          # The driver is loaded by path at run time, in the same order the
          # dispatcher uses; PATH still needs the install tree so the smoke test
          # can find taosnative.dll next to the adapter.
          $env:Path = "C:\TDengine;C:\TDengine\driver;$env:Path"
          Push-Location taosadapter-src
          # Without these -X flags taosadapter reports its source defaults
          # (0.1.0 / git: unknown / build: unknown). BuildInfo contains a space,
          # so keep each -X value quoted for the linker.
          $pkg = 'github.com/taosdata/taosadapter/v3/version'
          $ldflags = "-X $pkg.Version=$v -X $pkg.CommitID=$commit -X '$pkg.BuildInfo=$buildTime'"
          go build -ldflags $ldflags -o ..\build\build\bin\taosadapter.exe .
          if ($LASTEXITCODE -ne 0) { throw 'taosadapter build failed' }
          Pop-Location
          # make_install.bat already ran, so place the binary in the package tree
          # by hand (the client package excludes it explicitly).
          Copy-Item build\build\bin\taosadapter.exe C:\TDengine\taosadapter.exe -Force
          & C:\TDengine\taosadapter.exe -V

      - name: Package with Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found' }
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Push-Location packaging\tools
          & $iscc /DMyAppInstallName="TDengine-server-$v-Windows-x64" `
                  /DMyAppVersion="$v" `
                  /DCusName=TDengine /DCusPrompt=taos `
                  /DMyAppExcludeSource='' `
                  tdengine.iss "/O$PWD\..\..\release"
          if ($LASTEXITCODE -ne 0) { throw 'server package failed' }
          & $iscc /DMyAppInstallName="TDengine-client-$v-Windows-x64" `
                  /DMyAppVersion="$v" `
                  /DCusName=TDengine /DCusPrompt=taos `
                  /DMyAppExcludeSource="taosd.exe,taosadapter.exe" `
                  tdengine.iss "/O$PWD\..\..\release"
          if ($LASTEXITCODE -ne 0) { throw 'client package failed' }
          Pop-Location
          Get-ChildItem release\*.exe | Format-Table Name, Length

      - name: Smoke test installed server
        shell: pwsh
        run: |
          $env:Path = "C:\TDengine;$env:Path"
          $ver = & C:\TDengine\taosd.exe -V 2>&1 | Out-String
          if ($ver -notmatch 'taosd version') { throw "taosd -V failed: $ver" }
          Write-Host $ver
          foreach ($tool in 'taosadapter.exe', 'taosBenchmark.exe', 'taosdump.exe') {
            if (-not (Test-Path "C:\TDengine\$tool")) { throw "missing package component: $tool" }
          }
          $av = & C:\TDengine\taosadapter.exe -V 2>&1 | Out-String
          Write-Host $av
          $proc = Start-Process -FilePath 'C:\TDengine\taosd.exe' -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            # mnode answers 'show databases' (information_schema) before the
            # dnode has registered itself, and a CREATE DATABASE issued in that
            # window fails with 'Out of dnodes' because support_vnodes is still
            # 0. Wait for the dnode row to report 'ready' instead.
            $r = (& C:\TDengine\taos.exe -s 'show dnodes' 2>&1 | Out-String)
            if ($r -match '\bready\b') { $ready = $true; break }
          }
          if (-not $ready) {
            $diag = (& C:\TDengine\taos.exe -s 'show dnodes' 2>&1 | Out-String)
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "taosd dnode did not become ready in time: $diag"
          }
          # Retry the DDL once in case another dnode transition races the check.
          $sql = ''
          for ($i = 0; $i -lt 3; $i++) {
            $sql = (& C:\TDengine\taos.exe -s "create database if not exists smoke; use smoke; create table if not exists t1 (ts timestamp, val double); insert into t1 values (now, 1.5); select count(*) from t1;" 2>&1 | Out-String)
            if ($sql -match 'Insert OK') { break }
            Start-Sleep -Seconds 3
          }
          Write-Host $sql
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if ($sql -notmatch 'Insert OK') { throw "smoke SQL failed: $sql" }

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TDengine-Windows-x64-${{ steps.ver.outputs.version }}
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
